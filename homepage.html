<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<style>
:root {
  --card: rgba(40,40,40,0.55);
  --text: #eaeaea;
  --blur: blur(25px);
}

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  background: url("https://ik.imagekit.io/4twkegdf2/unnamed.jpg") no-repeat center/cover;
}

/* CLOCK */
.clock {
  position: absolute;
  top: 60px;
  left: 20px;
  background: var(--card);
  backdrop-filter: var(--blur);
  border-radius: 80px;
  padding: 35px 45px;
  text-align: center;
}

.time {
  font-size: 56px;
  font-weight: 600;
  letter-spacing: 1px;
}

.date {
  font-size: 16px;
  opacity: 0.8;
  margin-bottom: 5px;
}

/* TEXTS */
.texts {
  position: absolute;
  left: 20px;
  bottom: 150px;
}

.texts div {
  background: var(--card);
  backdrop-filter: var(--blur);
  padding: 10px 18px;
  border-radius: 18px;
  margin-bottom: 10px;
  display: inline-block;
  font-size: 14px;
}

/* SHORTCUTS */
.shortcuts {
  position: absolute;
  bottom: 50px;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 30px;
}

.icon {
  width: 65px;
  height: 65px;
  background: var(--card);
  backdrop-filter: var(--blur);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.25s;
  box-shadow: 0 6px 25px rgba(0,0,0,0.5);
}

.icon img {
  width: 28px;
  height: 28px;
  filter: invert(1) brightness(1.5);
}

.icon:active {
  transform: scale(1.2);
}

/* Responsive */
@media (max-width: 500px) {
  .time { font-size: 42px; }
  .icon { width: 58px; height: 58px; }
}
</style>
</head>

<body>

<!-- CLOCK -->
<div class="clock">
  <div class="date" id="date"></div>
  <div class="time" id="time"></div>
</div>

<!-- TEXTS -->
<div class="texts">
  <div>You are Maidenless!</div>
  <div id="greeting"></div>
</div>

<!-- SHORTCUTS -->
<div class="shortcuts">
  <a href="https://youtube.com" class="icon">
    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg">
  </a>

  <a href="https://github.com" class="icon">
    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg">
  </a>

  <a href="http://192.168.1.254/" class="icon">
  <img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/wifi.svg">
</a>
</div>

<script>
// CLOCK
function updateClock() {
  const now = new Date();

  const time = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  const date = now.toLocaleDateString([], {weekday:'short', day:'numeric'});

  document.getElementById('time').textContent = time;
  document.getElementById('date').textContent = date;
}
setInterval(updateClock, 1000);
updateClock();

// GREETING
function updateGreeting() {
  const hour = new Date().getHours();
  let greeting = "Hello";

  if (hour < 12) greeting = "Good Morning!";
  else if (hour < 18) greeting = "Good Afternoon!";
  else greeting = "Good Evening!";

  document.getElementById("greeting").textContent = greeting;
}
updateGreeting();
</script>

</body>
</html>
